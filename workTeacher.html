<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 英语老师の紧急通知</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #ff4444;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,68,68,0.3);
        }
        .modal h1 { color: #ff4444; margin-bottom: 20px; font-size: 24px; }
        .modal p { margin-bottom: 15px; line-height: 1.6; color: #ccc; }
        .accept-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            font-weight: bold;
        }
        .accept-btn:hover { background: #cc0000; transform: scale(1.05); }
        .reject-btn {
            background: transparent;
            border: 1px solid #666;
            color: #666;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            position: relative;
        }
        #content { display: none; padding: 40px; max-width: 800px; width: 100%; }
        .header { 
            text-align: center; 
            margin-bottom: 30px;
            border-bottom: 2px solid #ff4444;
            padding-bottom: 20px;
        }
        .header h1 { color: #ff4444; font-size: 32px; margin-bottom: 10px; }
        .header p { color: #888; font-size: 14px; }
        .task-card {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #ff4444;
        }
        .task-card h3 { color: #ff4444; margin-bottom: 10px; }
        .task-card p { color: #ccc; line-height: 1.8; }
        .warning {
            text-align: center;
            color: #ff4444;
            font-size: 12px;
            margin-top: 30px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .danmaku {
            position: fixed;
            color: rgba(255,68,68,0.3);
            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="modal">
            <h1>🔔 英语老师の强制通知</h1>
            <p>检测到您有一份<strong>不可拒绝</strong>的英语作业待查收。</p>
            <p style="font-size:12px; color:#888;">⚠️ 本通知已锁定，无法关闭、无法返回、无法假装没看见。</p>
            <button class="accept-btn" onclick="acceptFate()">✅ 我接受命运</button>
            <br>
            <button class="reject-btn" id="rejectBtn" onmouseover="runAway(this)" onclick="runAway(this)">❌ 我想拒绝</button>
        </div>
    </div>

    <div id="content">
        <div class="header">
            <h1>📚 今日英语作业</h1>
            <p>既然你点了接受，那就乖乖做完吧 😈</p>
        </div>

        <div id="taskContainer"></div>

        <p class="warning">⚠️ 本页面已截图存档，未按时完成者将被英语老师の死亡凝视锁定 ⚠️</p>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();
        });

        function runAway(btn) {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.style.transition = 'all 0.1s';
        }

        function startDanmaku() {
            const texts = [
                "拒绝无效！", "接受命运吧！", "英语老师正在注视你",
                "作业不会自己写完的", "别挣扎了", "F12也没用的",
                "右键？不存在的", "乖乖写作业", "Love English, Love Life",
                "你逃不掉的", "Deadline is coming", "No excuses!"
            ];
            setInterval(() => {
                const d = document.createElement('div');
                d.className = 'danmaku';
                d.textContent = texts[Math.floor(Math.random() * texts.length)];
                d.style.top = Math.random() * window.innerHeight + 'px';
                d.style.right = '-200px';
                document.body.appendChild(d);
                const duration = 5000 + Math.random() * 5000;
                d.animate([
                    { transform: 'translateX(0)' },
                    { transform: `translateX(-${window.innerWidth + 300}px)` }
                ], { duration, easing: 'linear' });
                setTimeout(() => d.remove(), duration);
            }, 800);
        }

        function renderTasks(tasks) {
            const container = document.getElementById('taskContainer');
            container.innerHTML = '';
            tasks.forEach((task, index) => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <h3>📝 Task ${index + 1}: ${task.title}</h3>
                    <p>
                        ${task.content}<br>
                        <span style="color:#ff4444;font-size:12px;">
                            (${task.note || ''})
                        </span>
                    </p>
                `;
                container.appendChild(card);
            });
        }

        function acceptFate() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            fetch('tasks.json')
                .then(response => response.json())
                .then(data => renderTasks(data))
                .catch(err => console.error('加载作业失败:', err));

            startDanmaku();
        }
    </script>
</body>
</html>
