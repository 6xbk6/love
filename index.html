<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 给你的一封情书</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            color: #fff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 背景粒子画布 */
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        /* 内容区域 */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        h1 { font-size: 2rem; margin-bottom: 20px; opacity: 0; animation: fadeIn 2s forwards; }
        .typewriter {
            font-size: 1.2rem;
            line-height: 2;
            min-height: 150px;
            text-align: left;
            padding: 0 20px;
            border-left: 2px solid #ff6b6b;
        }
        .cursor { animation: blink 1s infinite; }
        
        /* 按钮 */
        .btn-group { margin-top: 40px; opacity: 0; transition: opacity 1s; }
        button {
            padding: 12px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-yes { background: #ff6b6b; color: #fff; }
        .btn-no { background: transparent; border: 1px solid #fff; color: #fff; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,107,107,0.6); }

        /* 音乐控制 */
        .music-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <button class="music-btn" id="musicBtn">🎵</button>

    <div class="container">
        <h1>💌 To My Favorite Person</h1>
        <div class="typewriter" id="text"></div>
        <div class="btn-group" id="btnGroup">
            <button class="btn-yes" onclick="sayYes()">愿意 💖</button>
            <button class="btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">让我想想</button>
        </div>
    </div>

    <!-- 背景音乐：建议替换为你自己的链接，或者留空 -->
    <audio id="bgMusic" loop>
        <!-- <source src="https://music.163.com/song/media/outer/url?id=1901371847.mp3" type="audio/mpeg"> -->
    </audio>

<script>
    // 1. 打字机效果
    const text = `遇见你的那天，\n风很轻，云很淡。\n\n后来我发现，\n所有的风景，\n都不及你回头时的一笑。\n\n我想把余生的温柔，\n都写进给你的情书里。`;
    let i = 0;
    const speed = 80;
    const textEl = document.getElementById('text');

    function typeWriter() {
        if (i < text.length) {
            textEl.innerHTML = text.substring(0, i+1) + '<span class="cursor">|</span>';
            i++;
            setTimeout(typeWriter, speed);
        } else {
            textEl.innerHTML = text; // 移除光标
            document.getElementById('btnGroup').style.opacity = '1';
        }
    }
    setTimeout(typeWriter, 1000);

    // 2. 逃跑的按钮
    function moveNo() {
        const btn = document.getElementById('noBtn');
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        btn.style.position = 'fixed';
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
        btn.innerText = ['别走嘛', '再想想？', '给个机会', '呜呜呜', '点左边！'][Math.floor(Math.random()*5)];
    }

    // 3. 点击愿意的效果
    function sayYes() {
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-size:3rem;text-align:center;padding:20px;">🎉 余生请多指教！🎉<br><span style="font-size:1.5rem;margin-top:20px;display:block;">💖 爱你 💖</span></div>';
        createFireworks();
    }

    // 4. 背景爱心粒子 + 烟花
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];

    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    class Particle {
        constructor(x, y, color, isFirework = false) {
            this.x = x; this.y = y;
            this.color = color;
            this.alpha = 1;
            if (isFirework) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.decay = 0.02;
            } else {
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = Math.random() * 1 + 0.5;
                this.decay = 0.005;
                this.size = Math.random() * 3 + 1;
            }
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size || 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, w, h);
        // 自动飘落爱心
        if (Math.random() < 0.1) particles.push(new Particle(Math.random()*w, -10, '#ff6b6b'));
        
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }
    animate();

    // 点击烟花
    window.addEventListener('click', (e) => {
        const colors = ['#ff6b6b', '#feca57', '#ff9ff3', '#54a0ff'];
        for(let i=0; i<30; i++) {
            particles.push(new Particle(e.clientX, e.clientY, colors[Math.floor(Math.random()*colors.length)], true));
        }
    });

    // 音乐控制
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;
    musicBtn.onclick = () => {
        if (isPlaying) { music.pause(); musicBtn.innerText = '🎵'; }
        else { music.play().catch(()=>{}); musicBtn.innerText = '🔇'; }
        isPlaying = !isPlaying;
    };
    // 尝试自动播放（浏览器可能会拦截，需用户点击）
    document.body.onclick = () => { if(!isPlaying) { music.play().catch(()=>{}); isPlaying=true; musicBtn.innerText='🔇'; } };
</script>
</body>
</html>
